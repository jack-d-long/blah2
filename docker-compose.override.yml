# Run blah2 with 2x clock-synchronised RTL-SDRs (config/config-rtlsdr.yml).
# config/override-rtlsdr.yml is written by the web control page (/control).
# Merged automatically by docker compose; delete to use config/config.yml.
services:

  blah2:
    volumes:
      - /dev/bus/usb:/dev/bus/usb:rw
    command: "/blah2/bin/blah2 -c config/config-rtlsdr.yml -o config/override-rtlsdr.yml"

  blah2_api:
    command: "node server.js /usr/src/app/config/config-rtlsdr.yml /usr/src/app/config/override-rtlsdr.yml"
